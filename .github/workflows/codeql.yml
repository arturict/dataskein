name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - '**/*.cjs'
      - '**/*.cts'
      - '**/*.htm'
      - '**/*.html'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.mts'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.cjs'
      - '**/*.cts'
      - '**/*.htm'
      - '**/*.html'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.mts'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
  schedule:
    - cron: '17 4 * * 3'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
