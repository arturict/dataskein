name: Bug report
description: Report reproducible incorrect behavior with synthetic data
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Do not attach private datasets, credentials, or personal information.
  - type: input
    id: version
    attributes:
      label: DataSkein version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 151 on Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide exact steps and a small synthetic input or generator.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed private data, credentials, and personal information.
          required: true
        - label: This is not a security vulnerability.
          required: true
